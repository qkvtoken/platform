services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qkv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qkv
      POSTGRES_PASSWORD: qkv
      POSTGRES_DB: qkv
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qkv -d qkv"]
      interval: 5s
      timeout: 5s
      retries: 10
