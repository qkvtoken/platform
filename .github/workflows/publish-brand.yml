name: Publish @qkvtoken/brand

on:
  push:
    tags:
      - "brand-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true

permissions:
  contents: read
  id-token: write   # required for npm provenance + OIDC trusted publisher auth

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/brand
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to >= 11.5 (required for OIDC trusted publishers)
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/brand-v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/brand-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag:    $TAG_VERSION"
          echo "package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Publish with provenance (OIDC trusted publisher)
        run: npm publish --provenance --access public
        # No NODE_AUTH_TOKEN — npm CLI 11.5+ detects the OIDC id-token from
        # GitHub Actions and authenticates against the trusted publisher
        # configured at npmjs.com -> @qkvtoken/brand -> access.
